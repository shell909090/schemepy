[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schemepy"
version = "2.0"
description = "Scheme interpreter with tail calls, debugging and execution snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
scheme = "schemepy.__main__:main"

[tool.setuptools]
packages = ["schemepy"]
